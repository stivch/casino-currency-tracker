<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Session overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Deliberately bare. Everything a normal page carries — a heading, a
       border, a scrollbar — is furniture that would be captured along with the
       figures, so the only thing in here is the figures. -->
  <div class="stage" id="stage">
    <div class="panel" id="panel" hidden></div>
    <p class="idle" id="idle"></p>
  </div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
